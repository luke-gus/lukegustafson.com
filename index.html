<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Request to Join | Luke's Leadership Briefing</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#102443">
<link rel="icon" href="/favicon.ico?v=2" sizes="32x32">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/site.webmanifest?v=2">
<meta property="og:title" content="Request to Join | Luke's Leadership Briefing">
<meta property="og:image" content="https://signup.lukegustafson.com/banner.jpg">
<link rel="preload" as="image" href="banner.jpg?v=2">
<style>
  :root{
    --navy:#102443; --red:#c8102e; --gold:#c4a033; --paper:#f7f0dc; --cream:#fbfaf5; --ink:#25303d;
    --muted:#5f6a7a; --border:#d9dfe6; --foot:#c2cede;
    --sans:Arial,Helvetica,sans-serif; --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55}
  .wrap{max-width:760px;margin:0 auto;background:var(--cream);box-shadow:0 0 0 1px rgba(16,36,67,.06),0 12px 40px rgba(16,36,67,.10)}
  .banner{display:block;width:100%;height:auto;aspect-ratio:1200/450;background:#faf7f2}
  .card{background:#fff;border:1px solid var(--border);border-top:5px solid var(--navy);margin:30px 40px 34px;padding:28px 34px 28px}
  h1{font-family:var(--serif);color:var(--navy);font-size:30px;line-height:1.2;margin:0 0 10px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 22px}
  .legend{font-size:13px;font-weight:bold;letter-spacing:2.5px;text-transform:uppercase;color:var(--navy);margin:26px 0 8px}
  .rule{height:3px;background:var(--gold);margin:0 0 16px;border:0}
  .field{margin:0 0 16px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .row3{display:grid;grid-template-columns:2fr 1fr 1.2fr;gap:0 14px}
  label{display:block;font-weight:bold;color:var(--navy);font-size:15px;margin:0 0 6px}
  label i{font-style:normal;font-weight:normal;color:var(--muted)}
  input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:#fff;border:1px solid #b9c3d0;border-radius:4px;padding:12px 13px;-webkit-appearance:none;appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--navy) 50%),linear-gradient(135deg,var(--navy) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 12px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:30px}
  textarea{min-height:120px;resize:vertical;line-height:1.5}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(196,160,51,.35)}
  fieldset.freq{border:0;margin:0 0 16px;padding:0;min-width:0}
  fieldset.freq legend{display:block;font-weight:bold;color:var(--navy);font-size:15px;margin:0 0 8px;padding:0}
  .opt{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #b9c3d0;border-radius:4px;padding:12px 13px;margin:0 0 8px;cursor:pointer;font-weight:normal;color:var(--ink);font-size:16px}
  .opt input{flex:0 0 auto;width:20px;height:20px;margin:0;accent-color:var(--navy)}
  .opt b{color:var(--navy)}
  .opt:has(input:checked){border-color:var(--navy);box-shadow:0 0 0 2px rgba(16,36,67,.15);background:#fbfaf5}
  .consent{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border-left:5px solid var(--gold);padding:14px 16px;margin:22px 0 20px;cursor:pointer}
  .consent input{flex:0 0 auto;width:22px;height:22px;margin:2px 0 0;accent-color:var(--navy)}
  .consent span{font-size:14px;line-height:1.5;color:var(--ink);font-weight:normal}
  .hp{position:absolute!important;left:-10000px!important;width:1px;height:1px;overflow:hidden}
  button{display:block;width:100%;font:inherit;font-size:18px;font-weight:bold;letter-spacing:.5px;color:#fff;background:var(--navy);border:0;border-bottom:4px solid var(--red);border-radius:4px;padding:15px 18px;cursor:pointer}
  button:hover{background:#1a3560}
  button[disabled]{opacity:.65;cursor:wait}
  .err{display:none;background:#fdecee;border-left:5px solid var(--red);color:#7a0b1c;padding:12px 16px;margin:0 0 16px;font-size:15px}
  .thanks{display:none}
  .thanks .check{width:52px;height:52px;border-radius:50%;background:var(--paper);border:3px solid var(--gold);color:var(--navy);font-size:28px;line-height:46px;text-align:center;margin:0 0 14px}
  .thanks h2{font-family:var(--serif);color:var(--navy);font-size:24px;line-height:1.3;margin:0}
  .sent .thanks{display:block}
  .sent form,.sent .formhead{display:none}
  .goldband{height:5px;background:var(--gold)}
  footer{background:var(--navy);color:var(--foot);padding:22px 40px 26px;font-size:13px;line-height:1.6}
  footer .fn{font-family:var(--serif);font-size:20px;color:#fff;margin:0 0 2px}
  @media (max-width:640px){
    body{font-size:16px;background:var(--cream)}
    .wrap{box-shadow:none}
    .card{margin:16px 8px 22px;padding:20px 14px 20px}
    h1{font-size:27px}
    .row{gap:0 10px}
    .row3{grid-template-columns:1fr 1fr;gap:0 10px}
    .row3 .city{grid-column:1 / -1}
    footer{padding:20px 14px 24px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="banner" src="banner.jpg?v=2" width="1200" height="450" alt="Luke's Leadership Briefing">
  </header>

  <main>
    <section class="card" id="request" aria-live="polite">
      <div class="formhead">
        <h1>Request to Join</h1>
        <p class="sub">All fields are required unless marked optional.</p>
      </div>
      <div class="err" id="err" role="alert"></div>
      <form id="form" action="https://formsubmit.co/luke.gustafson@capitol.tn.gov" method="POST">
        <div class="row">
          <div class="field"><label for="first">First name</label>
            <input id="first" name="first_name" type="text" autocomplete="given-name" required maxlength="60"></div>
          <div class="field"><label for="last">Last name</label>
            <input id="last" name="last_name" type="text" autocomplete="family-name" required maxlength="60"></div>
        </div>
        <div class="field"><label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="200"></div>
        <div class="field"><label for="phone">Phone number</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required minlength="10" maxlength="25" placeholder="(615) 555-0123"></div>

        <div class="legend">Mailing address</div>
        <hr class="rule">
        <div class="field"><label for="street">Street address</label>
          <input id="street" name="street_address" type="text" autocomplete="address-line1" required maxlength="150"></div>
        <div class="field"><label for="street2">Apt, suite, etc. <i>(optional)</i></label>
          <input id="street2" name="address_line_2" type="text" autocomplete="address-line2" maxlength="100"></div>
        <div class="row3">
          <div class="field city"><label for="city">City</label>
            <input id="city" name="city" type="text" autocomplete="address-level2" required maxlength="80"></div>
          <div class="field"><label for="state">State</label>
            <select id="state" name="state" autocomplete="address-level1" required>
            <option value="AL">AL</option>
            <option value="AK">AK</option>
            <option value="AZ">AZ</option>
            <option value="AR">AR</option>
            <option value="CA">CA</option>
            <option value="CO">CO</option>
            <option value="CT">CT</option>
            <option value="DE">DE</option>
            <option value="DC">DC</option>
            <option value="FL">FL</option>
            <option value="GA">GA</option>
            <option value="HI">HI</option>
            <option value="ID">ID</option>
            <option value="IL">IL</option>
            <option value="IN">IN</option>
            <option value="IA">IA</option>
            <option value="KS">KS</option>
            <option value="KY">KY</option>
            <option value="LA">LA</option>
            <option value="ME">ME</option>
            <option value="MD">MD</option>
            <option value="MA">MA</option>
            <option value="MI">MI</option>
            <option value="MN">MN</option>
            <option value="MS">MS</option>
            <option value="MO">MO</option>
            <option value="MT">MT</option>
            <option value="NE">NE</option>
            <option value="NV">NV</option>
            <option value="NH">NH</option>
            <option value="NJ">NJ</option>
            <option value="NM">NM</option>
            <option value="NY">NY</option>
            <option value="NC">NC</option>
            <option value="ND">ND</option>
            <option value="OH">OH</option>
            <option value="OK">OK</option>
            <option value="OR">OR</option>
            <option value="PA">PA</option>
            <option value="RI">RI</option>
            <option value="SC">SC</option>
            <option value="SD">SD</option>
            <option value="TN" selected>TN</option>
            <option value="TX">TX</option>
            <option value="UT">UT</option>
            <option value="VT">VT</option>
            <option value="VA">VA</option>
            <option value="WA">WA</option>
            <option value="WV">WV</option>
            <option value="WI">WI</option>
            <option value="WY">WY</option>
            </select></div>
          <div class="field"><label for="zip">ZIP</label>
            <input id="zip" name="zip" type="text" autocomplete="postal-code" inputmode="numeric" required pattern="[0-9]{5}(-[0-9]{4})?" maxlength="10" title="5-digit ZIP code"></div>
        </div>

        <div class="legend">About you</div>
        <hr class="rule">
        <div class="field"><label for="org">Organization</label>
          <input id="org" name="organization" type="text" autocomplete="organization" required maxlength="150"></div>
        <div class="field"><label for="title">Title</label>
          <input id="title" name="title" type="text" autocomplete="organization-title" required maxlength="150"></div>
        <div class="field"><label for="why">Why do you want to join?</label>
          <textarea id="why" name="why_join" required maxlength="1500"></textarea></div>

        <fieldset class="freq">
          <legend>How often would you like to receive the briefing?</legend>
          <label class="opt"><input type="radio" name="frequency" value="Once daily (morning, 7 AM CT)" required> <span><b>Once daily</b> (morning, 7 AM CT)</span></label>
          <label class="opt"><input type="radio" name="frequency" value="Twice daily (7 AM and 5 PM CT)"> <span><b>Twice daily</b> (7 AM and 5 PM CT)</span></label>
          <label class="opt"><input type="radio" name="frequency" value="Three times daily (7 AM, noon, and 5 PM CT)"> <span><b>Three times daily</b> (7 AM, noon, and 5 PM CT)</span></label>
        </fieldset>

        <label class="consent" for="consent">
          <input id="consent" name="consent" type="checkbox" value="Yes" required>
          <span id="consent-text">I agree to receive emails and text messages from Luke Gustafson at the email address and phone number provided. Message frequency varies. Message and data rates may apply. Reply STOP to opt out of texts.</span>
        </label>
        <input type="hidden" name="consent_text" value="I agree to receive emails and text messages from Luke Gustafson at the email address and phone number provided. Message frequency varies. Message and data rates may apply. Reply STOP to opt out of texts.">
        <input type="hidden" name="consent_timestamp" value="">

        <div class="hp" aria-hidden="true">
          <label for="company_website">Leave this field empty</label>
          <input id="company_website" name="_honey" type="text" tabindex="-1" autocomplete="off">
        </div>
        <input type="hidden" name="_subject" value="Briefing request">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_cc" value="gustafson.luke@gmail.com">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="https://signup.lukegustafson.com/?sent=1">
        <input type="hidden" name="_url" value="https://signup.lukegustafson.com/">
        <button type="submit" id="submit">Submit Request</button>
      </form>
      <div class="thanks" id="thanks" tabindex="-1">
        <div class="check" aria-hidden="true">&#10003;</div>
        <h2 id="thanks-h">Thank you. Your request has been received.</h2>
      </div>
    </section>
  </main>

  <div class="goldband"></div>
  <footer>
    <div class="fn">Luke's Leadership Briefing</div>
    <div>&copy; <span id="yr">2026</span> Luke Gustafson</div>
  </footer>
</div>

<script>
(function(){
  // FormSubmit AJAX endpoint. After activation, FormSubmit provides a random alias string; it can
  // replace the email in both URLs (here and the form action) so the address is not in page source.
  var FORM_ENDPOINT = "https://formsubmit.co/ajax/luke.gustafson@capitol.tn.gov";
  var card = document.getElementById("request"), form = document.getElementById("form");
  var err = document.getElementById("err"), btn = document.getElementById("submit");
  document.getElementById("yr").textContent = new Date().getFullYear();
  var here = location.origin + location.pathname;
  form.elements["_next"].value = here + "?sent=1";
  form.elements["_url"].value = here;

  function stamp(){
    var d = new Date();
    var ct = d.toLocaleString("en-US", {timeZone: "America/Chicago", dateStyle: "medium", timeStyle: "long"});
    return d.toISOString() + " (" + ct + ")";
  }
  // Fallback (no AJAX): stamp when the box is checked.
  document.getElementById("consent").addEventListener("change", function(){
    form.elements["consent_timestamp"].value = this.checked ? stamp() : "";
  });

  function showThanks(first){
    if (first) document.getElementById("thanks-h").textContent = "Thank you, " + first + ". Your request has been received.";
    card.classList.add("sent");
    card.scrollIntoView({block: "start"});
    document.getElementById("thanks").focus({preventScroll: true});
  }
  if (/[?&]sent=1/.test(location.search)) showThanks("");

  function fail(msg){ err.textContent = msg; err.style.display = "block"; btn.disabled = false; btn.textContent = "Submit Request"; err.scrollIntoView({block: "center"}); }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    err.style.display = "none";
    var f = form.elements;
    if (!form.querySelector('input[name="frequency"]:checked')) return fail("Please choose how often you would like to receive the briefing.");
    if (!f["consent"].checked) return fail("Please check the consent box to submit your request.");
    var first = f["first_name"].value.trim(), last = f["last_name"].value.trim();
    // Honeypot: real people never see this field. Pretend success and send nothing.
    if (f["_honey"].value) { showThanks(first); return; }

    btn.disabled = true; btn.textContent = "Sending...";
    var payload = {};
    new FormData(form).forEach(function(v, k){ if (k !== "_next") payload[k] = typeof v === "string" ? v.trim() : v; });
    payload.address_line_2 = payload.address_line_2 || "(none)";
    payload.consent = "Yes, box checked";
    payload.consent_timestamp = stamp();
    payload.consent_page = here;
    payload._subject = "Briefing request: " + first + " " + last;
    payload._replyto = payload.email;
    payload._honey = "";
    fetch(FORM_ENDPOINT, {
      method: "POST",
      headers: {"Content-Type": "application/json", "Accept": "application/json"},
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json().catch(function(){ return {}; }); })
      .then(function(d){
        var ok = d && (d.success === true || d.success === "true");
        var pending = d && /activat/i.test(d.message || "");  // held by FormSubmit until activation
        if (ok || pending) showThanks(first);
        else fail("Sorry, your request could not be sent just now. Please try again in a few minutes.");
      })
      .catch(function(){ fail("Sorry, your request could not be sent. Please check your connection and try again."); });
  });
})();
</script>
</body>
</html>
